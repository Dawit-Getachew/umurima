name: umurima
description: "Android SMS gateway for Umurima AI, an SMS farming advisor for Rwandan smallholder farmers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Vendored copy of the telephony plugin (MIT); see packages/telephony.
  telephony:
    path: packages/telephony

  dio: ^5.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.1
  flutter_background_service: ^5.0.0
  permission_handler: ^13.0.1
  connectivity_plus: ^6.1.3
  device_info_plus: ^11.1.0
  cupertino_icons: ^1.0.8

dependency_overrides:
  # 14.x compiles against Android API 37, which Android Gradle plugin 9.0.1 cannot
  # resolve (its maximum is 36); 13.0.1 has the same permissions API.
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.5
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
